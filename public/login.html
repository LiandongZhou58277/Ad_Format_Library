<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- self-contained: the app's stylesheet is behind the login gate, so nothing here depends on it -->
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: rgba(0,0,0,0.8); }
    .card { width: 360px; max-width: calc(100vw - 32px); border: 1px solid #d6d6d6; background: #fff; }
    .head { padding: 12px 16px; border-bottom: 1px solid #d6d6d6; font-size: 15px; font-weight: 500; line-height: 22px; letter-spacing: -0.375px; }
    .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 13px; line-height: 18px; letter-spacing: -0.325px; color: rgba(0,0,0,0.45); }
    input { width: 100%; border: 1px solid #d6d6d6; padding: 9px 10px; font: inherit; font-size: 13px; color: rgba(0,0,0,0.8); outline: none; background: #fff; }
    input:focus { border-color: rgba(0,0,0,0.6); }
    button { align-self: flex-end; border: none; background: #212121; color: #fff; padding: 7px 10px; font: inherit; font-size: 13px; font-weight: 500; line-height: 20px; letter-spacing: -0.325px; cursor: pointer; }
    button:hover { background: #000; }
    button:disabled { opacity: .6; cursor: default; }
    .err { font-size: 12px; line-height: 16px; color: #c0392b; min-height: 16px; }
  </style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="head">Ad Format Library</div>
    <div class="body">
      <label for="pw">Password</label>
      <input id="pw" type="password" autofocus required />
      <div class="err" id="err"></div>
      <button type="submit" id="btn">Enter</button>
    </div>
  </form>
  <script>
    // Already signed in (or no password configured)? Go straight to the app.
    fetch('/api/meta').then((r) => { if (r.ok) location.replace('/'); }).catch(() => {});

    const form = document.getElementById('form'), pw = document.getElementById('pw'), err = document.getElementById('err'), btn = document.getElementById('btn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = ''; btn.disabled = true;
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw.value }) });
        if (r.ok) { location.replace('/'); return; }
        err.textContent = 'Wrong password'; pw.select();
      } catch { err.textContent = 'Could not reach the server'; }
      btn.disabled = false;
    });
  </script>
</body>
</html>
